<!DOCTYPE html>
<html>
<head>
<title>Norton - Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: white;
    color: #172B37;
    transition: background 0.5s, color 0.5s;
}

/* NAVIGATION */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #172B37;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 23px;
    transition: background 0.5s;
}

.nav-menu {
    display: flex;
    gap: 35px;
}

.nav-menu a {
    color: white;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1px;
    transition: 0.3s;
}

.nav-menu a:hover {
    color: #72C6A5;
}

/* DARK MODE BUTTON */
#themeToggle {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    color: white;
    border: 1px solid #91A6A9;
    padding: 9px 14px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 1px;
}

#themeToggle:hover {
    background: #5DAB91;
    border-color: #5DAB91;
}

/* PAGE HEADING */
.page-heading {
    text-align: center;
    padding: 65px 20px 45px;
}

.page-heading h1 {
    font-size: 34px;
    letter-spacing: 5px;
    color: #172B37;
    margin-bottom: 12px;
}

.page-heading p {
    font-size: 12px;
    letter-spacing: 2px;
    color: #777;
}

/* GALLERY GRID */
.gallery-container {
    width: 85%;
    max-width: 1100px;
    margin: 0 auto;
    padding-bottom: 100px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.gallery-item {
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    cursor: pointer;
    background: #E5E9EB;
    border-radius: 3px;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s;
}

.gallery-item:hover img {
    transform: scale(1.05);
}

/* IMAGE LIGHTBOX */
.lightbox {
    display: none;
    position: fixed;
    z-index: 2000;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.lightbox.show {
    display: flex;
}

.lightbox img {
    max-width: 90%;
    max-height: 85vh;
    object-fit: contain;
}

.close-lightbox {
    position: absolute;
    top: 20px;
    right: 35px;
    color: white;
    font-size: 40px;
    cursor: pointer;
    background: none;
    border: none;
}

/* FOOTER */
footer {
    background: #172B37;
    color: white;
    text-align: center;
    padding: 30px;
    font-size: 12px;
    line-height: 2;
}

/* DARK MODE */
body.dark-mode {
    background: #121A20;
    color: white;
}

.dark-mode .navbar,
.dark-mode footer {
    background: #080E12;
}

.dark-mode .page-heading h1 {
    color: white;
}

.dark-mode .page-heading p {
    color: #C5CDD2;
}

/* MOBILE VIEW */
@media screen and (max-width: 800px) {
    .navbar {
        padding: 17px 8px;
        min-height: 75px;
    }

    .nav-menu {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        padding-top: 22px;
    }

    .nav-menu a {
        font-size: 10px;
    }

    #themeToggle {
        right: 8px;
        top: 7px;
        transform: none;
        padding: 6px 9px;
        font-size: 9px;
    }

    .page-heading {
        padding-top: 45px;
    }

    .gallery-container {
        width: 92%;
        padding-bottom: 70px;
    }

    .gallery-grid {
        gap: 12px;
    }

    .lightbox img {
        max-width: 95%;
    }
}
</style>
</head>

<body>

<!-- JAVASCRIPT -->
<script>

/* DARK AND LIGHT MODE */
function applyTheme() {
    var savedTheme = localStorage.getItem("nortonTheme");
    var button = document.getElementById("themeToggle");

    if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
        button.innerHTML = "☀ LIGHT";
    } else {
        document.body.classList.remove("dark-mode");
        button.innerHTML = "☾ DARK";
    }
}

function toggleTheme() {
    var isDark = document.body.classList.toggle("dark-mode");

    if (isDark) {
        localStorage.setItem("nortonTheme", "dark");
    } else {
        localStorage.setItem("nortonTheme", "light");
    }

    applyTheme();
}

/* IMAGE LIGHTBOX */
function openLightbox(item) {
    var image = item.querySelector("img");
    var lightbox = document.getElementById("lightbox");
    var lightboxImage = document.getElementById("lightboxImage");

    lightboxImage.src = image.src;
    lightbox.classList.add("show");
}

function closeLightbox() {
    document.getElementById("lightbox").classList.remove("show");
}

applyTheme();

</script>
